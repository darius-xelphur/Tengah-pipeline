name: Tengah Data Pipeline

on:
  schedule:
    - cron: '0 18 * * *'      # 02:00 SGT daily (18:00 UTC previous day)
  workflow_dispatch:           # allows manual triggering from the Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write GCP credentials
        run: echo '${{ secrets.GCP_SA_KEY }}' > tengah-analytics-5ec133554c9a.json

      - name: Run ingestion
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: python ingestion/extract_hdb_resale.py

      - name: Run staging transformation
        run: python transformations/run_transformation.py staging_hdb_resale.sql

      - name: Clean up credentials
        if: always()
        run: rm -f tengah-analytics-5ec133554c9a.json